[package]
name = "lc3"
version = "0.1.0+nostd"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "no_std port of lc3 0.1.0 (pure-Rust LC3 codec, bit-exact with liblc3)"
publish = false

[dependencies]
libm = "0.2"

[dev-dependencies]
# The unmodified crates.io release: the oracle for the bit-exactness tests in tests/.
lc3_upstream = { package = "lc3", version = "=0.1.0" }

[lints.clippy.all]
level = "warn"
priority = -1

[lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
unsafe_code = "deny"
