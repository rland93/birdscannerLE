[package]
name = "netcore"
version = "0.1.0"
edition = "2024"
description = "nRF5340 network core: SoftDevice Controller exposed as an HCI controller over shared RAM"

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7"
defmt = "1"
defmt-rtt = "1"
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-nrf = { version = "0.11", features = ["nrf5340-net", "time-driver-rtc1", "defmt", "unstable-pac"] }
embassy-sync = "0.8"
embassy-time = { version = "0.5", features = ["defmt", "defmt-timestamp-uptime-ms"] }
hci-shm = { path = "../crates/hci-shm" }
nrf-mpsl = { version = "0.4", features = ["nrf5340-net", "critical-section-impl", "defmt"] }
nrf-sdc = { version = "0.4", features = ["nrf5340-net", "multirole", "defmt"] }
panic-probe = { version = "1", features = ["print-defmt"] }
static_cell = "2"

[profile.release]
debug = 2
lto = true
codegen-units = 1
opt-level = "s"

[profile.dev]
opt-level = "s"
