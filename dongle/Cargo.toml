[package]
name = "dongle"
version = "0.1.0"
edition = "2024"
description = "nRF52840 dongle: LE Audio unicast client for the garden mics, forwarding LC3 over USB"

[dependencies]
bap = { path = "../crates/bap" }
bt-hci = { version = "0.10", features = ["defmt"] }
cortex-m = "0.7.7"
cortex-m-rt = "0.7"
defmt = "1"
defmt-rtt = "1"
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-futures = "0.1"
embassy-nrf = { version = "0.11", features = ["nrf52840", "time-driver-rtc1", "defmt", "unstable-pac"] }
embassy-sync = "0.8"
embassy-time = { version = "0.5", features = ["defmt", "defmt-timestamp-uptime-ms"] }
embassy-usb = { version = "0.6", features = ["defmt"] }
embedded-io = "0.7"
garden-link = { path = "../crates/garden-link", features = ["defmt"] }
hci-shm = { path = "../crates/hci-shm" }
heapless = "0.9"
nrf-mpsl = { version = "0.4", features = ["nrf52840", "critical-section-impl", "defmt"] }
nrf-sdc = { version = "0.4", features = ["nrf52840", "multirole", "defmt"] }
panic-probe = { version = "1", features = ["print-defmt"] }
sdc-hci = { path = "../crates/sdc-hci" }
static_cell = "2"
trouble-host = { version = "0.8", default-features = false, features = ["central", "scan", "gatt", "iso", "subrating", "defmt", "default-packet-pool", "default-packet-pool-mtu-255", "gatt-client-notification-queue-size-4"] }

[profile.release]
debug = 2
lto = true
codegen-units = 1
opt-level = "s"

[profile.dev]
opt-level = "s"
